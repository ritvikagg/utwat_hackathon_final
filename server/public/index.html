<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hivemind</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  [hidden] { display: none !important; }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  #agentStrip { display: flex; gap: 8px; flex-wrap: wrap; }
  .agent-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .agent-chip b { color: var(--text); }
  .presence-chip { display: inline-flex; align-items: center; gap: 6px; }
  .presence-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .presence-dot.online {
    background: var(--green);
    box-shadow: 0 0 0 2px rgba(63, 185, 80, 0.25);
  }
  .spinner {
    width: 10px;
    height: 10px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #userBox { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #userBox .group-pill {
    background: rgba(88,166,255,0.12);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    white-space: nowrap;
  }
  #userBox .name { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .gear-wrap { position: relative; }
  .gear-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
  }
  .dropdown-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    width: 240px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    z-index: 10;
  }
  .dropdown-panel label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .dropdown-panel .row { display: flex; gap: 6px; }
  .dropdown-panel .divider { border-top: 1px solid var(--border); margin: 14px 0; }
  .dropdown-panel .email-line { font-size: 12px; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .dropdown-panel button.full { width: 100%; }
  .dropdown-panel button.full + button.full { margin-top: 6px; }
  .dropdown-panel .error { margin-top: 6px; color: var(--red); font-size: 12px; min-height: 14px; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 28px 60px;
    display: grid;
    gap: 24px;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  section h2 {
    margin: 0 0 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  form.run-form {
    display: grid;
    grid-template-columns: 1.3fr 2fr auto;
    gap: 10px;
  }
  @media (max-width: 640px) {
    form.run-form { grid-template-columns: 1fr; }
  }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    width: 100%;
    min-width: 0;
  }
  button {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #061224;
    font-weight: 600;
    padding: 9px 18px;
    cursor: pointer;
    font-size: 13px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 400;
  }
  button.link {
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 400;
    padding: 0;
  }
  #runStatus { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  #runStatus a { color: var(--accent); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 640px; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.verified { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.draft { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge.script { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.tips { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge.none { background: rgba(139,148,158,0.15); color: var(--muted); }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.fail { background: rgba(248,81,73,0.15); color: var(--red); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .tips-cell textarea {
    width: 100%;
    min-height: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 6px 8px;
    resize: vertical;
  }
  .tips-cell button { margin-top: 6px; padding: 4px 10px; font-size: 11px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  details pre {
    margin-top: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    max-height: 180px;
    overflow: auto;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

  /* Full-screen overlays: auth + group picker */
  .overlay {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 380px;
  }
  .card h1 { margin: 0 0 4px; font-size: 22px; }
  .card h1 span { color: var(--accent); }
  .card p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .card label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .card .error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 16px; }
  .card .switcher { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
  .card button[type="submit"] { width: 100%; margin-top: 18px; padding: 10px; }

  .group-card { max-width: 460px; }
  .group-list { max-height: 280px; overflow-y: auto; margin-top: 14px; border-top: 1px solid var(--border); }
  .group-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 1px solid var(--border);
  }
  .group-row .name { font-weight: 600; }
  .group-row .count { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .group-row button { padding: 5px 14px; font-size: 12px; }
  .create-group-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<!-- Auth: login / sign up -->
<div id="authScreen" class="overlay" hidden>
  <div class="card">
    <h1>hive<span>mind</span></h1>
    <p class="sub" id="authSub">Log in to see your team's shared agent library.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" required autocomplete="username" />
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required autocomplete="current-password" />
      <button type="submit">Log in</button>
      <div class="switcher">No account? <button type="button" class="link" id="toSignup">Create one</button></div>
    </form>
    <form id="signupForm" hidden>
      <label for="signupEmail">Email</label>
      <input id="signupEmail" type="email" required autocomplete="username" />
      <label for="signupPassword">Password (min 8 characters)</label>
      <input id="signupPassword" type="password" required minlength="8" autocomplete="new-password" />
      <button type="submit">Create account</button>
      <div class="switcher">Already have an account? <button type="button" class="link" id="toLogin">Log in</button></div>
    </form>
    <div class="error" id="authError"></div>
  </div>
</div>

<!-- Group picker -->
<div id="groupScreen" class="overlay" hidden>
  <div class="card group-card">
    <h1 id="groupHeading">Join a group</h1>
    <p class="sub">Playbooks and activity are shared within a group. Join an existing one or start a new one.</p>
    <input id="groupSearch" placeholder="Search groups..." />
    <div class="group-list" id="groupList"></div>
    <div class="create-group-row">
      <input id="newGroupName" placeholder="New group name" />
      <button id="createGroupBtn">Create</button>
    </div>
    <div class="error" id="groupError"></div>
    <div class="switcher" id="cancelGroupSwitchRow" hidden>
      <button type="button" class="link" id="cancelGroupSwitch">Cancel</button>
    </div>
  </div>
</div>

<!-- Main app -->
<div id="appScreen" hidden>
<header>
  <h1>hive<span>mind</span></h1>
  <div id="agentStrip"></div>
  <div id="userBox">
    <span class="group-pill" id="groupPill"></span>
    <button class="secondary" id="switchGroupBtn">Switch group</button>
    <span class="name" id="userName"></span>
    <div class="gear-wrap">
      <button class="secondary gear-btn" id="gearBtn" title="Account settings" aria-label="Account settings">⚙</button>
      <div class="dropdown-panel" id="gearPanel" hidden>
        <label for="displayNameInput">Display name</label>
        <div class="row">
          <input id="displayNameInput" placeholder="your name" />
          <button id="saveDisplayNameBtn">Save</button>
        </div>
        <div class="error" id="displayNameError"></div>
        <div class="divider"></div>
        <div class="email-line" id="gearEmail"></div>
        <button class="secondary full" id="tokenBtn">Copy API token</button>
        <button class="secondary full" id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section>
    <h2>Run a task</h2>
    <form class="run-form" id="runForm">
      <input id="runUrl" placeholder="https://example.com" required />
      <input id="runTaskText" placeholder="task description (e.g. click the Learn more link)" required />
      <button type="submit" id="runBtn">Run</button>
    </form>
    <div id="runStatus"></div>
  </section>

  <section>
    <h2>Shared playbook library</h2>
    <div id="playbooks"></div>
  </section>

  <section>
    <h2>Activity — across every agent</h2>
    <div id="runs"></div>
  </section>
</main>
</div>

<script>
const $ = (sel) => document.querySelector(sel);

// ---------- Auth state ----------
let token = null;
let me = null; // { id, email, currentGroupId }
try { token = localStorage.getItem('hivemind_token'); } catch {}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}
function timeAgo(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}

async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) {
    signOut();
    throw new Error('Session expired — please log in again.');
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

function setToken(t, user) {
  token = t;
  me = user;
  try { localStorage.setItem('hivemind_token', t); } catch {}
}

function signOut() {
  token = null;
  me = null;
  try { localStorage.removeItem('hivemind_token'); } catch {}
  showScreen('auth');
}

function showScreen(which) {
  $('#authScreen').hidden = which !== 'auth';
  $('#groupScreen').hidden = which !== 'group';
  $('#appScreen').hidden = which !== 'app';
}

// ---------- Auth screen ----------
$('#toSignup').addEventListener('click', () => {
  $('#loginForm').hidden = true;
  $('#signupForm').hidden = false;
  $('#authSub').textContent = 'Create an account to start sharing a library with your team.';
  $('#authError').textContent = '';
});
$('#toLogin').addEventListener('click', () => {
  $('#signupForm').hidden = true;
  $('#loginForm').hidden = false;
  $('#authSub').textContent = "Log in to see your team's shared agent library.";
  $('#authError').textContent = '';
});

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#authError').textContent = '';
  try {
    const body = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: $('#loginEmail').value.trim(),
        password: $('#loginPassword').value,
      }),
    });
    setToken(body.token, body.user);
    await afterAuth();
  } catch (err) {
    $('#authError').textContent = err.message;
  }
});

$('#signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#authError').textContent = '';
  try {
    const body = await api('/api/auth/signup', {
      method: 'POST',
      body: JSON.stringify({
        email: $('#signupEmail').value.trim(),
        password: $('#signupPassword').value,
      }),
    });
    setToken(body.token, body.user);
    await afterAuth();
  } catch (err) {
    $('#authError').textContent = err.message;
  }
});

// ---------- Group screen ----------
let groupSearchTimer = null;
$('#groupSearch').addEventListener('input', () => {
  clearTimeout(groupSearchTimer);
  groupSearchTimer = setTimeout(loadGroups, 200);
});

async function loadGroups() {
  const q = $('#groupSearch').value.trim();
  const groups = await api('/api/groups' + (q ? '?q=' + encodeURIComponent(q) : ''));
  const el = $('#groupList');
  if (groups.length === 0) {
    el.innerHTML = '<div class="empty">No groups found. Create one below.</div>';
    return;
  }
  el.innerHTML = groups
    .map(
      (g) => `
      <div class="group-row">
        <div><span class="name">${esc(g.name)}</span><span class="count">${g.memberCount} member${g.memberCount === 1 ? '' : 's'}</span></div>
        <button class="${g.id === me?.currentGroupId ? 'secondary' : ''}" data-id="${esc(g.id)}">
          ${g.id === me?.currentGroupId ? 'Current' : 'Join'}
        </button>
      </div>`
    )
    .join('');
  el.querySelectorAll('button[data-id]').forEach((btn) => {
    btn.addEventListener('click', () => joinGroup(btn.dataset.id));
  });
}

async function joinGroup(groupId) {
  $('#groupError').textContent = '';
  try {
    const body = await api(`/api/groups/${groupId}/join`, { method: 'POST' });
    me = body.user;
    showScreen('app');
    renderUserBox();
    refreshAll();
  } catch (err) {
    $('#groupError').textContent = err.message;
  }
}

$('#createGroupBtn').addEventListener('click', async () => {
  const name = $('#newGroupName').value.trim();
  if (!name) return;
  $('#groupError').textContent = '';
  try {
    const body = await api('/api/groups', { method: 'POST', body: JSON.stringify({ name }) });
    me = body.user;
    $('#newGroupName').value = '';
    showScreen('app');
    renderUserBox();
    refreshAll();
  } catch (err) {
    $('#groupError').textContent = err.message;
  }
});

$('#cancelGroupSwitch').addEventListener('click', () => {
  showScreen('app');
});

function showGroupScreen(isSwitching) {
  $('#groupHeading').textContent = isSwitching ? 'Switch group' : 'Join a group';
  $('#cancelGroupSwitchRow').hidden = !isSwitching;
  $('#groupSearch').value = '';
  $('#groupError').textContent = '';
  showScreen('group');
  loadGroups();
}

$('#switchGroupBtn').addEventListener('click', () => showGroupScreen(true));

// ---------- App screen: user box + account settings gear ----------
$('#logoutBtn').addEventListener('click', async () => {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
  signOut();
});

$('#tokenBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(token);
    const btn = $('#tokenBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  } catch {
    alert('Your API token (for HIVEMIND_API_TOKEN in .env):\n\n' + token);
  }
});

function openGearPanel() {
  $('#displayNameInput').value = me.displayName || '';
  $('#displayNameError').textContent = '';
  $('#gearEmail').textContent = me.email;
  $('#gearPanel').hidden = false;
}
function closeGearPanel() {
  $('#gearPanel').hidden = true;
}
$('#gearBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#gearPanel').hidden ? openGearPanel() : closeGearPanel();
});
$('#gearPanel').addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', () => closeGearPanel());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeGearPanel(); });

$('#saveDisplayNameBtn').addEventListener('click', async () => {
  const displayName = $('#displayNameInput').value.trim();
  if (!displayName) {
    $('#displayNameError').textContent = 'Enter a name.';
    return;
  }
  const btn = $('#saveDisplayNameBtn');
  btn.disabled = true;
  try {
    const body = await api('/api/auth/display-name', {
      method: 'PUT',
      body: JSON.stringify({ displayName }),
    });
    me = body.user;
    renderUserBox();
    closeGearPanel();
  } catch (err) {
    $('#displayNameError').textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

async function afterAuth() {
  if (!me.currentGroupId) {
    showGroupScreen(false);
  } else {
    showScreen('app');
    renderUserBox();
    refreshAll();
  }
}

function renderUserBox() {
  $('#userName').textContent = me.displayName || me.email;
  $('#groupPill').textContent = me.currentGroupName || '';
}

// ---------- Main dashboard (same as before, group-scoped server-side) ----------
function sendHeartbeat() {
  api('/api/presence/heartbeat', { method: 'POST' }).catch(() => {});
}

async function loadPresence() {
  const members = await api('/api/presence');
  $('#agentStrip').innerHTML = members
    .map(
      (m) => `
        <span class="agent-chip presence-chip">
          <span class="presence-dot ${m.online ? 'online' : ''}" title="${m.online ? 'Online' : 'Offline'}"></span>
          <b>${esc(m.name)}</b>
          ${m.taskRunning ? '<span class="spinner" title="Task running"></span>' : ''}
        </span>`
    )
    .join('');
}

async function loadPlaybooks() {
  const playbooks = await api('/api/playbooks');
  const el = $('#playbooks');
  if (playbooks.length === 0) {
    el.innerHTML = '<div class="empty">No playbooks yet — run a task below to start teaching the library.</div>';
    return;
  }
  el.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Domain / Task</th><th>Status</th><th>Successes</th><th>Script</th><th>Tips (editable)</th>
      </tr></thead>
      <tbody>
        ${playbooks
          .map((p, i) => `
            <tr>
              <td><div class="mono">${esc(p.domain)}</div><div class="muted">${esc(p.taskSignature)}</div></td>
              <td><span class="badge ${p.status}">${p.status}</span></td>
              <td>${p.successCount}</td>
              <td>${
                p.script
                  ? `<details><summary>${p.script.length} steps</summary><pre>${esc(JSON.stringify(p.script, null, 2))}</pre></details>`
                  : '<span class="muted">—</span>'
              }</td>
              <td class="tips-cell">
                <textarea id="tips-${i}" placeholder="Add a tip for this site...">${esc(p.tips)}</textarea>
                <button class="secondary" data-idx="${i}">Save tip</button>
              </td>
            </tr>
          `)
          .join('')}
      </tbody>
    </table>
    </div>
  `;
  el.querySelectorAll('button[data-idx]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const idx = btn.dataset.idx;
      const tips = $(`#tips-${idx}`).value;
      const entry = playbooks[idx];
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        await api('/api/playbooks', {
          method: 'PUT',
          body: JSON.stringify({ ...entry, tips, updatedAt: new Date().toISOString() }),
        });
        btn.textContent = 'Saved';
      } catch (err) {
        btn.textContent = 'Error';
      }
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Save tip'; }, 1200);
    });
  });
}

async function loadRuns() {
  const runs = await api('/api/runs?limit=30');
  const el = $('#runs');
  if (runs.length === 0) {
    el.innerHTML = '<div class="empty">No runs yet.</div>';
    return;
  }
  el.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Agent</th><th>Task</th><th>Mode</th><th>Result</th><th>Time</th><th>LLM calls</th><th>When</th>
      </tr></thead>
      <tbody>
        ${runs
          .map(
            (r) => `
            <tr>
              <td><b>${esc(r.agentName)}</b></td>
              <td><div class="mono">${esc(r.domain)}</div><div class="muted">${esc(r.taskDescription)}</div></td>
              <td><span class="badge ${r.mode}">${r.mode === 'script' ? 'replay' : r.mode}</span></td>
              <td><span class="badge ${r.success ? 'ok' : 'fail'}">${r.success ? 'success' : 'failed'}</span></td>
              <td>${(r.elapsedMs / 1000).toFixed(1)}s</td>
              <td>${r.llmCalls}</td>
              <td class="muted">
                ${timeAgo(r.timestamp)}
                ${r.sessionViewerUrl ? `· <a href="${esc(r.sessionViewerUrl)}" target="_blank" style="color:var(--accent)">session</a>` : ''}
              </td>
            </tr>`
          )
          .join('')}
      </tbody>
    </table>
    </div>
  `;
}

async function refreshAll() {
  sendHeartbeat();
  await Promise.all([loadPresence(), loadPlaybooks(), loadRuns()]);
}

$('#runForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('#runUrl').value.trim();
  const task = $('#runTaskText').value.trim();
  const btn = $('#runBtn');
  btn.disabled = true;
  btn.textContent = 'Running...';
  $('#runStatus').textContent = 'Agent is working — this can take a few seconds to ~15s on a cold run.';
  try {
    const result = await api('/api/tasks/run', {
      method: 'POST',
      body: JSON.stringify({ url, task }),
    });
    $('#runStatus').innerHTML = `${result.success ? '✅' : '⚠️'} ${esc(result.summary)} — ${(result.elapsedMs / 1000).toFixed(1)}s, ${result.llmCalls} LLM calls (${esc(result.usedLibrary)}). <a href="${esc(result.sessionViewerUrl)}" target="_blank">view session</a>`;
  } catch (err) {
    $('#runStatus').textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run';
    refreshAll();
  }
});

// ---------- Boot ----------
async function boot() {
  if (!token) {
    showScreen('auth');
    return;
  }
  try {
    const body = await api('/api/auth/me');
    me = body.user;
    await afterAuth();
  } catch {
    showScreen('auth');
  }
}

boot();
setInterval(() => {
  if (!$('#appScreen').hidden) refreshAll();
}, 4000);
</script>
</body>
</html>
