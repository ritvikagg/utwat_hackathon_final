<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hivemind</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  #agentStrip { display: flex; gap: 8px; flex-wrap: wrap; }
  .agent-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .agent-chip b { color: var(--text); }
  #meBox { display: flex; align-items: center; gap: 6px; }
  #meBox label { color: var(--muted); font-size: 12px; }
  #meName {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 5px 9px;
    font-size: 12px;
    width: 110px;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 28px 60px;
    display: grid;
    gap: 24px;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  section h2 {
    margin: 0 0 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  form.run-form {
    display: grid;
    grid-template-columns: 1.3fr 2fr auto;
    gap: 10px;
  }
  @media (max-width: 640px) {
    form.run-form { grid-template-columns: 1fr; }
  }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    width: 100%;
    min-width: 0;
  }
  button {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #061224;
    font-weight: 600;
    padding: 9px 18px;
    cursor: pointer;
    font-size: 13px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 400;
  }
  #runStatus { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  #runStatus a { color: var(--accent); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 640px; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.verified { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.draft { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge.script { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.tips { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge.none { background: rgba(139,148,158,0.15); color: var(--muted); }
  .badge.ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.fail { background: rgba(248,81,73,0.15); color: var(--red); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .tips-cell textarea {
    width: 100%;
    min-height: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 6px 8px;
    resize: vertical;
  }
  .tips-cell button { margin-top: 6px; padding: 4px 10px; font-size: 11px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  details pre {
    margin-top: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    max-height: 180px;
    overflow: auto;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>

<header>
  <h1>hive<span>mind</span></h1>
  <div id="meBox">
    <div id="agentStrip"></div>
    <label for="meName">You:</label>
    <input id="meName" placeholder="your name" />
  </div>
</header>

<main>
  <section>
    <h2>Run a task</h2>
    <form class="run-form" id="runForm">
      <input id="runUrl" placeholder="https://example.com" required />
      <input id="runTaskText" placeholder="task description (e.g. click the Learn more link)" required />
      <button type="submit" id="runBtn">Run</button>
    </form>
    <div id="runStatus"></div>
  </section>

  <section>
    <h2>Shared playbook library</h2>
    <div id="playbooks"></div>
  </section>

  <section>
    <h2>Activity — across every agent</h2>
    <div id="runs"></div>
  </section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);

function randomName() {
  const adjectives = ['swift', 'quiet', 'bright', 'brisk', 'keen'];
  const animals = ['otter', 'falcon', 'lynx', 'heron', 'fox'];
  const a = adjectives[Math.floor(Math.random() * adjectives.length)];
  const b = animals[Math.floor(Math.random() * animals.length)];
  return `${a}-${b}`;
}

let myAgentName = '';
try {
  myAgentName = localStorage.getItem('hivemind_agent') || '';
} catch {
  // localStorage can throw in some embedded/private contexts — fall back below.
}
if (!myAgentName) myAgentName = randomName();

const meInput = $('#meName');
meInput.value = myAgentName;
meInput.addEventListener('change', () => {
  myAgentName = meInput.value.trim() || randomName();
  meInput.value = myAgentName;
  try {
    localStorage.setItem('hivemind_agent', myAgentName);
  } catch {
    // Ignore — name just won't persist across reloads in this context.
  }
});

function timeAgo(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

async function loadAgents() {
  const agents = await fetch('/api/agents').then((r) => r.json());
  $('#agentStrip').innerHTML =
    agents.length === 0
      ? ''
      : agents
          .map(
            (a) =>
              `<span class="agent-chip"><b>${esc(a.name)}</b> · ${a.runCount} runs · ${timeAgo(a.lastSeen)}</span>`
          )
          .join('');
}

async function loadPlaybooks() {
  const playbooks = await fetch('/api/playbooks').then((r) => r.json());
  const el = $('#playbooks');
  if (playbooks.length === 0) {
    el.innerHTML = '<div class="empty">No playbooks yet — run a task below to start teaching the library.</div>';
    return;
  }
  el.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Domain / Task</th><th>Status</th><th>Successes</th><th>Script</th><th>Tips (editable)</th>
      </tr></thead>
      <tbody>
        ${playbooks
          .map((p, i) => `
            <tr>
              <td><div class="mono">${esc(p.domain)}</div><div class="muted">${esc(p.taskSignature)}</div></td>
              <td><span class="badge ${p.status}">${p.status}</span></td>
              <td>${p.successCount}</td>
              <td>${
                p.script
                  ? `<details><summary>${p.script.length} steps</summary><pre>${esc(JSON.stringify(p.script, null, 2))}</pre></details>`
                  : '<span class="muted">—</span>'
              }</td>
              <td class="tips-cell">
                <textarea id="tips-${i}" placeholder="Add a tip for this site...">${esc(p.tips)}</textarea>
                <button class="secondary" data-domain="${esc(p.domain)}" data-task="${esc(p.taskSignature)}" data-idx="${i}">Save tip</button>
              </td>
            </tr>
          `)
          .join('')}
      </tbody>
    </table>
    </div>
  `;
  el.querySelectorAll('button[data-domain]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const idx = btn.dataset.idx;
      const tips = $(`#tips-${idx}`).value;
      const entry = playbooks[idx];
      btn.disabled = true;
      btn.textContent = 'Saving...';
      await fetch('/api/playbooks', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...entry, tips, updatedAt: new Date().toISOString() }),
      });
      btn.textContent = 'Saved';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Save tip'; }, 1200);
    });
  });
}

async function loadRuns() {
  const runs = await fetch('/api/runs?limit=30').then((r) => r.json());
  const el = $('#runs');
  if (runs.length === 0) {
    el.innerHTML = '<div class="empty">No runs yet.</div>';
    return;
  }
  el.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th>Agent</th><th>Task</th><th>Mode</th><th>Result</th><th>Time</th><th>LLM calls</th><th>When</th>
      </tr></thead>
      <tbody>
        ${runs
          .map(
            (r) => `
            <tr>
              <td><b>${esc(r.agentName)}</b></td>
              <td><div class="mono">${esc(r.domain)}</div><div class="muted">${esc(r.taskDescription)}</div></td>
              <td><span class="badge ${r.mode}">${r.mode === 'script' ? 'replay' : r.mode}</span></td>
              <td><span class="badge ${r.success ? 'ok' : 'fail'}">${r.success ? 'success' : 'failed'}</span></td>
              <td>${(r.elapsedMs / 1000).toFixed(1)}s</td>
              <td>${r.llmCalls}</td>
              <td class="muted">
                ${timeAgo(r.timestamp)}
                ${r.sessionViewerUrl ? `· <a href="${esc(r.sessionViewerUrl)}" target="_blank" style="color:var(--accent)">session</a>` : ''}
              </td>
            </tr>`
          )
          .join('')}
      </tbody>
    </table>
    </div>
  `;
}

async function refreshAll() {
  await Promise.all([loadAgents(), loadPlaybooks(), loadRuns()]);
}

$('#runForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('#runUrl').value.trim();
  const task = $('#runTaskText').value.trim();
  const btn = $('#runBtn');
  btn.disabled = true;
  btn.textContent = 'Running...';
  $('#runStatus').textContent = 'Agent is working — this can take a few seconds to ~15s on a cold run.';
  try {
    const res = await fetch('/api/tasks/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, task, agentName: myAgentName }),
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'run failed');
    $('#runStatus').innerHTML = `${result.success ? '✅' : '⚠️'} ${esc(result.summary)} — ${(result.elapsedMs / 1000).toFixed(1)}s, ${result.llmCalls} LLM calls (${esc(result.usedLibrary)}). <a href="${esc(result.sessionViewerUrl)}" target="_blank">view session</a>`;
  } catch (err) {
    $('#runStatus').textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run';
    refreshAll();
  }
});

refreshAll();
setInterval(refreshAll, 4000);
</script>
</body>
</html>
